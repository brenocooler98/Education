[package]
name = "education"
version = "0.1.0"
edition = "2021"
authors = ["brenocooler98"]
description = "A cross-platform educational application built with Rust."
license = "Apache-2.0"
repository = "https://github.com/brenocooler98/Education"
homepage = "https://github.com/brenocooler98/Education"
readme = "README.md"
keywords = ["education", "learning", "rust", "android"]
categories = ["education", "gui"]
publish = false

[lib]
name = "education"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "education"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

log = "0.4"
thiserror = "2.0"
once_cell = "1.20"
parking_lot = "0.12"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6"
android_logger = "0.15"
jni = "0.21"
ndk-context = "0.1"

[profile.dev]
opt-level = 1
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
incremental = false
