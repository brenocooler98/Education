name: Build

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Android architecture"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - arm32
          - x86_64

      build_type:
        description: "Build configuration"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  android:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      ANDROID_API: "24"
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Dependencies
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$TOOLCHAIN"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=${TOOLCHAIN}/armv7a-linux-androideabi24-clang" >> "$GITHUB_ENV"

          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/x86_64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Select Android Architecture
        id: target
        shell: bash
        run: |
          case "${{ inputs.architecture }}" in
            arm64)
              echo "triple=aarch64-linux-android" >> "$GITHUB_OUTPUT"
              ;;
            arm32)
              echo "triple=armv7-linux-androideabi" >> "$GITHUB_OUTPUT"
              ;;
            x86_64)
              echo "triple=x86_64-linux-android" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported architecture"
              exit 1
              ;;
          esac

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: education-android-${{ inputs.architecture }}

      - name: Install Cargo APK
        shell: bash
        run: |
          cargo install cargo-apk --locked

      - name: Verify Rust Project
        shell: bash
        run: |
          cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Check Android Library
        shell: bash
        run: |
          cargo check \
            --lib \
            --target "${{ steps.target.outputs.triple }}"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ steps.target.outputs.triple }}"

          if [ "${{ inputs.build_type }}" = "release" ]; then
            cargo apk build \
              --lib \
              --release \
              --target "$TARGET"
          else
            cargo apk build \
              --lib \
              --target "$TARGET"
          fi

      - name: Locate Android APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          find target -type f -name "*.apk" \
            -exec cp {} dist/ \;

          if ! find dist -maxdepth 1 -name "*.apk" | grep -q .; then
            echo "No APK was generated."
            exit 1
          fi

          ls -lh dist/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Education-Android-${{ inputs.architecture }}-${{ inputs.build_type }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
